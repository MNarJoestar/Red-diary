<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#160607" />

  <link rel="manifest" href="manifest.json" />

  <title>Diario Rojo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <img
          class="app-logo"
          src="https://static.wikia.nocookie.net/dc-comics-cinematic-universe/images/0/07/Redlanternlogo.png/revision/latest?cb=20180102184644"
          alt="Emblema de linterna roja"
        />
        <p class="eyebrow">Anotaciones</p>
      </header>

      <section id="homeScreen" class="screen home-screen" aria-labelledby="homeTitle">
        <h1 id="homeTitle">Registro de entradas</h1>
        <p class="intro">Deja fluir como sangre que brota</p>
        <nav class="home-actions" aria-label="Menú del diario">
          <button class="button button-primary" type="button" data-screen="editor">Nueva entrada</button>
          <button class="button button-secondary" type="button" data-screen="daily">Entradas Diarias</button>
          <button class="button button-secondary" type="button" data-screen="entries">Entradas</button>
        </nav>
      </section>

      <section id="editorScreen" class="screen editor-screen" aria-labelledby="editorTitle" hidden>
        <h1 id="editorTitle">Nueva entrada</h1>
        <label class="visually-hidden" for="entryText">Escribe tu entrada</label>
        <textarea id="entryText" placeholder="Escribe lo que tengas en mente..." spellcheck="true"></textarea>
        <div class="save-actions">
          <button class="button button-primary" type="button" data-save="daily">Guardar Entrada diaria</button>
          <button class="button button-secondary" type="button" data-save="entries">Guardar Entrada</button>
        </div>
        <p id="saveMessage" class="save-message" role="status" aria-live="polite"></p>
      </section>

      <section id="dailyScreen" class="screen list-screen" aria-labelledby="dailyTitle" hidden>
        <h1 id="dailyTitle">Entradas Diarias</h1>
        <div id="dailyList" class="entry-list"></div>
      </section>

      <section id="entriesScreen" class="screen list-screen" aria-labelledby="entriesTitle" hidden>
        <h1 id="entriesTitle">Entradas</h1>
        <div id="entriesList" class="entry-list"></div>
      </section>

      <section id="detailScreen" class="screen detail-screen" aria-labelledby="detailTitle" hidden>
        <h1 id="detailTitle"></h1>
        <p id="detailText" class="detail-text"></p>
        <button id="deleteEntry" class="button delete-button" type="button">Eliminar entrada</button>
      </section>

      <footer class="app-footer">
        <button id="backToList" class="back-button" type="button" hidden>← Volver a las entradas</button>
        <button id="backHome" class="back-button" type="button" hidden>← Volver al inicio</button>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
